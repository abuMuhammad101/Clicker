<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clicker</title>
    <script>
      // Before first paint, so there is no flash: the person's own choice (user menu > Theme) if they made one,
      // otherwise the system's light/dark setting. tokens.css reads [data-theme].
      ;(function () {
        try {
          var media = matchMedia('(prefers-color-scheme: dark)')
          var apply = function () {
            var chosen = null
            try { chosen = localStorage.getItem('clicker.theme') } catch (e) {}
            document.documentElement.dataset.theme = chosen === 'light' || chosen === 'dark' ? chosen : media.matches ? 'dark' : 'light'
          }
          apply()
          media.addEventListener('change', apply)
          window.addEventListener('clicker-theme', apply)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
